<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MY儀式｜見るまで確定じゃない</title>
  <meta name="description" content="結果を見る直前、なぜか出てしまうあなたの祈り行動を記録するミニ診断。">
  <meta property="og:title" content="MY儀式｜見るまで確定じゃない">
  <meta property="og:description" content="連打する。なでる。隠す。見ないふりをする。あなたのMY儀式を診断します。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/ogp.png">
  <meta name="theme-color" content="#140712">
  <link rel="icon" type="image/png" sizes="1254x1254" href="./assets/ui/app_icon_mygishiki.png">
  <link rel="apple-touch-icon" href="./assets/ui/app_icon_mygishiki.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app" class="app">
    <section id="intro" class="intro-screen grimoire-screen">
      <div class="intro-inner sealed-notebook">
        <span class="notebook-warning" aria-hidden="true">※ 深夜二時以降 閲覧注意</span>
        <div class="intro-logo-sheet">
          <img class="title-logo" src="./assets/ui/logo_mygishiki.png" alt="MY儀式">
        </div>
        <p class="intro-subcopy">見るまで確定じゃない</p>
        <div class="intro-incantation">
          <p>結果が出る直前、人はなぜか変なことをする。</p>
          <p class="ritual-verbs"><span>連打する</span><span>なでる</span><span>隠す</span><span>見ないふりをする</span></p>
          <p>それは祈りか、黒歴史か。<br>これは、あなたの「MY儀式」の記録です。</p>
        </div>
        <div class="seal-row" aria-hidden="true"><i></i><img src="./assets/ui/app_icon_mygishiki.png" alt=""><i></i></div>
        <button id="startBtn" class="primary-btn ritual-start"><span>封印ノートを開く</span><small>OPEN THE ARCHIVE</small></button>
        <p class="handwritten-note" aria-hidden="true">消したはずの儀式ほど、よく覚えている。</p>
      </div>
    </section>

    <section id="game" class="game-screen hidden" aria-live="polite">
      <header class="stage-hud">
        <div><span id="stageCount">1 / 5</span><strong id="stageTitle">兆しのランプ</strong></div>
        <p id="stagePrompt">光るかどうかは、まだ見ない。</p>
      </header>
      <div id="experienceMount"></div>
      <div class="stage-footer">
        <p id="stageWhisper" class="stage-whisper"></p>
        <button id="nextBtn" class="next-btn hidden">次の結果へ</button>
      </div>
    </section>

    <section id="result" class="result-screen archive-screen hidden">
      <div class="result-card ritual-report">
        <header class="result-brand">
          <img class="result-brand-logo" src="./assets/ui/logo_mygishiki.png" alt="MY儀式">
          <img class="result-seal-icon" src="./assets/ui/app_icon_mygishiki.png" alt="" aria-hidden="true">
        </header>
        <p class="eyebrow report-kicker">封印解除済み・黒歴史儀式診断書</p>
        <div class="result-heading">
          <img id="resultIcon" class="result-icon" alt="">
          <div><span class="result-label">MY儀式タイプ</span><h1 id="resultType"></h1></div>
        </div>
        <p id="resultSummary" class="result-summary"></p>
        <p class="behavior"><strong>主な祈り行動</strong><span id="resultBehavior"></span></p>
        <div class="score-grid">
          <div><span>信仰心</span><strong id="scoreFaith">0</strong></div>
          <div><span>ためらい</span><strong id="scoreHesitation">0</strong></div>
          <div><span>現実逃避</span><strong id="scoreAvoidance">0</strong></div>
          <div><span>人間味</span><strong id="scoreHuman">0</strong></div>
        </div>
        <section class="fortune-card" aria-labelledby="fortuneTitle">
          <div>
            <span>当たり数</span>
            <strong id="fortuneHits">0 / 5</strong>
          </div>
          <div>
            <span id="fortuneTitle">今日の運勢</span>
            <strong id="fortuneRank"></strong>
          </div>
          <p id="fortuneComment"></p>
        </section>
        <p class="evidence"><span>科学的根拠</span><strong>なし</strong><small>※魔力測定も未実施</small></p>
        <h2 class="archive-heading">封印記録：ステージ別ログ</h2>
        <div id="finalLog" class="final-log"></div>
        <div class="actions">
          <button id="shareBtn" class="primary-btn">結果をシェア</button>
          <button id="restartBtn" class="ghost-btn">もう一度</button>
        </div>
        <p id="copyStatus" class="copy-status"></p>
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
